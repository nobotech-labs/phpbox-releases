name: Sync Release Links & README

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/sync-releases.yml'
      - 'scripts/sync-readme.py'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync README Release Links & Checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync-readme.py

      - name: Commit and Push Changes If Updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain README.md)" ]; then
            git add README.md
            git commit -m "docs: auto-sync latest platform release links and checksums [skip ci]"
            git push origin master
          else
            echo "README.md is already up to date with the latest releases."
          fi
